[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macroquant-lab"
version = "0.1.0"
description = "Quantitative finance and macroeconomic analysis lab."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<3.0",
    "plotly>=5.24",
    "yfinance>=0.2.54",
    "pandas-datareader>=0.10",
    "streamlit>=1.41",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
